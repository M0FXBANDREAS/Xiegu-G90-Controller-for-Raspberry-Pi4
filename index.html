<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HamTec • G90 Controller</title>
<style>
:root{color-scheme:dark;--orange:#ffa238;--green:#63efb0;--screen:#081019;--metal:#22252a}*{box-sizing:border-box}body{margin:0;background:#111317;color:#edf1f5;font:15px system-ui,sans-serif}button,input,select{font:inherit}button{min-height:44px;border:1px solid #51565e;border-radius:5px;background:linear-gradient(#363b43,#23272d);color:#f4f5f7;padding:7px 12px;touch-action:manipulation}button:active,button.on{background:#78501e;border-color:var(--orange)}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange)}input,select{background:#10151c;color:#fff;border:1px solid #606975;border-radius:4px;min-height:42px;padding:6px;max-width:100%}label{display:block}header{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:10px}.brand{font-weight:700;font-size:25px;letter-spacing:2px}.brand small{font-size:12px;display:block;letter-spacing:1px;color:var(--orange)}#connection{font-size:12px;color:var(--orange)}main{max-width:1200px;margin:auto;padding:14px;background:linear-gradient(110deg,#30343a,#1c1f24);border:6px solid #363a40;border-radius:14px}.face{display:grid;grid-template-columns:112px minmax(0,1fr) 150px;gap:12px}.side{display:flex;flex-direction:column;gap:8px}.lcd{border:6px solid #080b0f;border-radius:7px;background:var(--screen);padding:10px;min-width:0}.readout{display:flex;align-items:center;justify-content:space-between;gap:8px}.freq{font:clamp(25px,5vw,49px) ui-monospace,monospace;color:var(--orange);letter-spacing:-1px;background:none;border:0;padding:0;white-space:nowrap;min-height:52px}.mode{font-size:19px;color:var(--green)}.info{font:12px ui-monospace,monospace;color:#bdc8d6;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin:5px 0}.meters{display:flex;gap:15px;color:#d4e3f2;font-size:12px;margin:8px 0}.scope{position:relative}canvas{display:block;width:100%;height:96px;background:#07111d}#waterfall{height:90px;border-top:1px solid #39424f}.axis{display:flex;justify-content:space-between;font-size:11px;color:#98a7b7}.dial{border-radius:50%;width:130px;height:130px;margin:5px auto;background:radial-gradient(circle at 38% 35%,#555d67,#23272c 55%,#080a0c 58%,#343b43 66%,#0c0e11 70%);border:5px solid #555c65;box-shadow:0 5px 10px #0008;display:flex;align-items:center;justify-content:center;color:#ffb253;touch-action:none}.dial span{background:#101319;border-radius:30px;padding:8px 12px}.twins{display:grid;grid-template-columns:1fr 1fr;gap:6px}.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:12px}.keys button{font-size:13px;padding:6px}.danger{color:#ffbbad;border-color:#a86a5e}.tune{color:#ffb35a}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}#message{font-size:12px;min-height:28px;overflow-wrap:anywhere}dialog{background:#20262e;color:#f1f4f7;border:1px solid #777;border-radius:10px;width:min(650px,94vw);max-height:94vh;padding:20px}dialog::backdrop{background:#000b}.dialogtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialogtop h2{margin:0;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields label{color:#c8d2df}.fields output{color:var(--orange)}input[type=range]{width:100%;padding:0;accent-color:var(--orange)}.wide{grid-column:1/-1}.note{color:#bdc9d7;line-height:1.5;font-size:14px}.emptygraph{height:170px;background:repeating-linear-gradient(0deg,transparent,transparent 33px,#394450 34px),repeating-linear-gradient(90deg,transparent,transparent 64px,#394450 65px);display:grid;place-items:center;border:1px solid #536173;margin:15px 0;color:#d0d8e0}.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.numpad button{font-size:22px}.frequencyinput{width:100%;font:30px ui-monospace,monospace}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#a4b0bf;font-size:12px}.tabbuttons{display:flex;gap:8px;flex-wrap:wrap}.statuslabel{color:var(--green)}
@media(max-width:750px){main{padding:10px;border-width:3px}.face{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(3,1fr)}.right{display:grid;grid-template-columns:repeat(3,1fr)}.dial{display:none}.keys{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.brand{font-size:20px}header{flex-wrap:wrap}.freq{font-size:35px}.footer{align-items:flex-start}}
</style></head><body>
<main>
<header><div class="brand">XIEGU <small>G90 • HAMTEC TOUCH CONTROLLER</small></div><div id="connection">Starting…</div><button id="connect">CONNECT CAT</button></header>
<div class="face">
<aside class="side"><button data-panel="levels">AF / SQL</button><button data-panel="cw">CW KEY</button><button data-panel="levels">RF POWER</button><button data-panel="tuner" class="tune">ANT TUNER</button><button data-panel="swr">SWR SCAN</button><button data-panel="settings">SETTINGS</button></aside>
<section class="lcd"><div class="info"><span id="vfo">VFO A</span><span id="atu">ATU —</span><span id="iqstatus">I/Q disconnected</span></div><div class="readout"><button id="frequency" class="freq" aria-label="Enter frequency">14.200.000</button><span id="mode" class="mode">USB</span></div><div class="meters"><span id="smeter">S raw —</span><span id="powerMeter">Po raw —</span><span id="swrMeter">SWR raw —</span></div><div class="scope"><canvas id="spectrum" aria-label="Receive spectrum, relative dBFS"></canvas><canvas id="waterfall" aria-label="Receive waterfall"></canvas></div><div class="axis"><span id="leftaxis">−24 kHz</span><span>VFO centre • dBFS</span><span id="rightaxis">+24 kHz</span></div></section>
<aside class="side right"><div class="twins"><button data-band="-1">BAND −</button><button data-band="1">BAND +</button></div><div id="dial" class="dial" role="img" aria-label="Drag vertically to tune"><span>TUNE</span></div><div class="twins"><button id="down">−</button><button id="up">+</button></div><label class="muted">Tuning step<select id="step" style="width:100%"><option value="10">10 Hz</option><option value="100" selected>100 Hz</option><option value="1000">1 kHz</option><option value="10000">10 kHz</option></select></label></aside>
</div>
<nav class="keys" aria-label="Radio controls"><button data-panel="modes">MODE</button><button data-vfo="A">VFO A</button><button data-vfo="B">VFO B</button><button data-vfo="SWAP">A ↔ B</button><button id="split">SPLIT</button><button id="agc">AGC</button><button data-switch="pre">PRE</button><button id="att">ATT</button><button data-switch="nb">NB</button><button data-switch="comp">COMP</button><button data-switch="lock">LOCK</button><button data-panel="presets">MEMORIES</button><button data-panel="iq">I/Q</button><button disabled title="Firmware-specific CAT filter command awaiting validation">FILTER*</button><button disabled title="No verified CAT RIT implementation">RIT*</button><button id="receive" class="danger">RECEIVE</button></nav>
<div class="footer"><div id="message" role="status" aria-live="polite">Loading controller…</div><span class="muted">* Pending firmware validation</span></div>
</main>
<dialog id="panel"><div class="dialogtop"><h2 id="paneltitle"></h2><button id="closepanel">CLOSE</button></div><div id="panelbody"></div></dialog>
<dialog id="keypad"><div class="dialogtop"><h2>Frequency • MHz</h2><button id="closekeypad">CLOSE</button></div><input id="frequencyinput" class="frequencyinput" inputmode="decimal" aria-label="Frequency in MHz"><div class="numpad" id="numpad"></div><button id="setfrequency" style="width:100%">SET FREQUENCY</button><p id="keyerror" role="alert"></p></dialog>
<script>
const TOKEN={{ token|tojson }};
let state={frequency:14200000,mode:'USB',values:{},switches:{},meters:{}}, busy=false, panelName='', dragging=false;
const $=id=>document.getElementById(id), bands=[1800000,3500000,5351500,7000000,10100000,14000000,18068000,21000000,24890000,28000000];
function message(text){$('message').textContent=text;}
async function action(name,value){
 if(busy){message('Previous command still running');return false;}
 busy=true;
 try{const response=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-G90-Token':TOKEN},body:JSON.stringify({name,value})});const data=await response.json();message(data.error||data.message);return response.ok;}
 catch(e){message('Controller connection lost: '+e.message);return false;}finally{busy=false;}
}
function frequencyLabel(hz){return Math.round(hz).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function draw(values){
 for(const id of ['spectrum','waterfall']){const c=$(id);const width=Math.round(c.clientWidth);if(c.width!==width){c.width=width;c.height=id==='spectrum'?96:90;}}
 const c=$('spectrum'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.fillStyle='#07111d';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#263b4c';ctx.lineWidth=1;
 for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke();}
 ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();
 if(!values){ctx.fillStyle='#9caebe';ctx.font='14px system-ui';ctx.fillText('Waiting for stereo I/Q input',12,48);return;}
 ctx.strokeStyle='#ffaf41';ctx.beginPath();values.forEach((v,i)=>{let x=i*w/(values.length-1),y=h-(Math.max(-100,Math.min(0,v))+100)/100*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
 const f=$('waterfall'),fc=f.getContext('2d');fc.drawImage(f,0,0,f.width,f.height-1,0,1,f.width,f.height-1);for(let x=0;x<f.width;x++){const v=values[Math.min(values.length-1,Math.floor(x/f.width*values.length))],a=Math.max(0,Math.min(1,(v+100)/85));fc.fillStyle=`hsl(${240-a*230} 85% ${8+a*52}%)`;fc.fillRect(x,0,1,1);}
}
async function poll(){
 try{const r=await fetch('/api/state');if(!r.ok)throw new Error('State unavailable');state=await r.json();$('frequency').textContent=frequencyLabel(state.frequency);$('mode').textContent=state.mode;$('vfo').textContent='Selected VFO '+state.vfo;$('atu').textContent='ATU '+({0:'BYPASS',1:'ON',2:'TUNING'}[state.tuner]||'UNKNOWN');$('connection').textContent=state.demo?'DEMO • NO RADIO COMMANDS':state.connected?(state.error?'CAT RESPONSE LOST':'CAT CONNECTED'):'LIVE • NOT CONNECTED';$('connect').disabled=state.connected;$('smeter').textContent='S raw '+(state.meters.signal??'—');$('powerMeter').textContent='Po raw '+(state.meters.rf_power??'—');$('swrMeter').textContent='SWR raw '+(state.meters.swr??'—');$('iqstatus').textContent=state.spectrum?(state.iq_clipped?'I/Q CLIPPING':'STEREO I/Q'):'I/Q NOT READY';$('leftaxis').textContent='−'+state.sample_rate/2000+' kHz';$('rightaxis').textContent='+'+state.sample_rate/2000+' kHz';document.querySelectorAll('[data-switch]').forEach(b=>b.classList.toggle('on',!!state.switches[b.dataset.switch]));$('split').classList.toggle('on',!!state.split);$('agc').textContent='AGC '+state.switches.agc;draw(state.spectrum);if(state.error)message(state.error);
 if($('panel').open&&panelName==='settings')$('catlog').textContent=state.log.join('\n')||'No CAT commands sent';
 if($('panel').open&&panelName==='swr')$('rawswr').textContent=state.meters.swr??'—';
 }catch(e){$('connection').textContent='CONTROLLER OFFLINE';message(e.message);}finally{setTimeout(poll, state.connected?500:250);}
}
function slider(name,label){return `<label>${label} <output id="value-${name}">${state.values[name]??0}</output><input data-level="${name}" type="range" min="0" max="255" value="${state.values[name]??0}"></label>`;}
function showPanel(name){
 panelName=name;let title='',html='';
 if(name==='levels'){title='AF • squelch • transmit power';html=`<div class="fields">${slider('volume','AF volume • CAT level')}${slider('squelch','Squelch • CAT level')}${slider('power','RF power • CAT level')}</div><p class="note">Levels are the radio’s 0–255 CAT scale. RF watts mapping must be verified on your firmware. Values are read back after adjustment.</p>`;}
 if(name==='cw'){title='CW controls';html=`<div class="fields">${slider('speed','Key speed • CAT level')}${slider('pitch','Sidetone • CAT level')}</div><p class="note">WPM and Hz mapping awaits firmware calibration.</p>`;}
 if(name==='modes'){title='Operating mode';html='<div class="tabbuttons">'+['LSB','USB','CW','CWR','AM','NFM'].map(m=>`<button data-mode="${m}">${m}</button>`).join('')+'</div>';}
 if(name==='tuner'){title='Automatic antenna tuner';html='<div class="tabbuttons"><button data-tuner="0">BYPASS</button><button data-tuner="1">ENABLE ATU</button><button data-tuner="2" class="tune">START TUNE • RF</button></div><p class="note">START TUNE produces RF. Use a suitable antenna or load and a permitted transmit frequency. Live start requires --allow-tune. Receive sends PTT release; it is not a verified ATU-abort command.</p>';}
 if(name==='swr'){title='SWR analyser • awaiting bench validation';html='<div class="emptygraph">No validated sweep data</div><div>SWR meter raw CAT value: <output id="rawswr">'+(state.meters.swr??'—')+'</output></div><p class="note">The built-in scanner has no verified CAT start command. A Pi-controlled sweep needs verified carrier generation, SWR conversion and transmit limits. I/Q alone cannot measure SWR.</p><button disabled>START SWEEP • UNAVAILABLE</button>';}
 if(name==='settings'){title='Connection & diagnostics';html='<p class="note">CAT: 19200 baud • 8N1. Connect the blue cable to the display head after radio startup, then press CONNECT CAT. Port, address and audio device are set using the launch options.</p><pre id="catlog"></pre>';}
 if(name==='iq'){title='Stereo I/Q capture';html='<p class="note">'+escapeText(state.iq_error||'Capture active')+'</p><p class="note">Left and right channels feed a complex FFT. Span is determined by capture rate; the radio and input interface may limit useful bandwidth. Disable microphone processing and AGC. Use --swap-iq if the spectrum is reversed.</p><p class="note">Spectrum levels are relative dBFS, not calibrated RF dBm. Audio playback and recording are not implemented in this version.</p>';}
 if(name==='presets'){title='Pi frequency memories';let presets;try{presets=JSON.parse(localStorage.getItem('g90presets')||'[]');if(!Array.isArray(presets))presets=[];}catch{presets=[];}html='<button id="savepreset">SAVE CURRENT FREQUENCY / MODE</button><div id="presets" class="tabbuttons" style="margin-top:12px">'+presets.map((p,i)=>`<button data-preset="${i}">${frequencyLabel(p.frequency)} ${escapeText(p.mode)}</button>`).join('')+'</div><p class="muted">Stored on this Pi browser. These do not write radio memory channels.</p>';}
 $('paneltitle').textContent=title;$('panelbody').innerHTML=html;$('panel').showModal();
}
function escapeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>showPanel(b.dataset.panel));$('closepanel').onclick=()=>$('panel').close();$('closekeypad').onclick=()=>$('keypad').close();$('connect').onclick=()=>action('connect');$('receive').onclick=()=>action('receive');
document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>action(b.dataset.switch,state.switches[b.dataset.switch]?0:1));$('agc').onclick=()=>action('agc',((state.switches.agc||0)+1)%4);$('att').onclick=()=>action('att');$('split').onclick=()=>action('split',state.split?0:1);document.querySelectorAll('[data-vfo]').forEach(b=>b.onclick=()=>action('vfo',b.dataset.vfo));
function tune(delta){action('frequency',Math.max(500000,Math.min(30000000,state.frequency+delta*Number($('step').value))));}$('up').onclick=()=>tune(1);$('down').onclick=()=>tune(-1);
document.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{let f=Number(b.dataset.band)>0?bands.find(v=>v>state.frequency):[...bands].reverse().find(v=>v<state.frequency);if(f)action('frequency',f);});
let startY=0;$('dial').onpointerdown=e=>{dragging=true;startY=e.clientY;$('dial').setPointerCapture(e.pointerId);};$('dial').onpointerup=e=>{if(dragging){dragging=false;const ticks=Math.round((startY-e.clientY)/8);if(ticks)tune(ticks);}};$('dial').onpointercancel=()=>dragging=false;
$('frequency').onclick=()=>{$('frequencyinput').value=(state.frequency/1e6).toFixed(6);$('keyerror').textContent='';$('keypad').showModal();};for(const key of ['1','2','3','4','5','6','7','8','9','.','0','⌫']){const b=document.createElement('button');b.textContent=key;b.onclick=()=>{let input=$('frequencyinput');input.value=key==='⌫'?input.value.slice(0,-1):input.value+key;};$('numpad').appendChild(b);}
$('setfrequency').onclick=async()=>{const value=Number($('frequencyinput').value);if(!Number.isFinite(value)||value<.5||value>30){$('keyerror').textContent='Enter 0.5–30 MHz';return;}if(await action('frequency',Math.round(value*1e6)))$('keypad').close();else $('keyerror').textContent=$('message').textContent;};
$('panelbody').addEventListener('input',e=>{if(e.target.dataset.level)$('value-'+e.target.dataset.level).textContent=e.target.value;});$('panelbody').addEventListener('change',async e=>{if(e.target.dataset.level){await action(e.target.dataset.level,Number(e.target.value));}});
$('panelbody').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode)await action('mode',b.dataset.mode);if(b.dataset.tuner){const value=Number(b.dataset.tuner);if(value===2&&!state.demo&&!confirm('Start antenna tuning? This transmits RF. Confirm your antenna/load and transmit frequency.'))return;await action('tuner',value);}if(b.id==='savepreset'){try{let p=JSON.parse(localStorage.getItem('g90presets')||'[]');if(!Array.isArray(p))p=[];p.push({frequency:state.frequency,mode:state.mode});localStorage.setItem('g90presets',JSON.stringify(p.slice(-30)));$('panel').close();showPanel('presets');}catch(e){message('Could not save preset: '+e.message);}}if(b.dataset.preset){const p=JSON.parse(localStorage.getItem('g90presets')||'[]')[Number(b.dataset.preset)];if(await action('frequency',p.frequency))await action('mode',p.mode);}});
poll();
</script></body></html>
